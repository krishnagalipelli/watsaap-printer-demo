[project]
name = "waprinter"
version = "2.0.0"
description = "Virtual Windows printer that sends printed invoices to customers over WhatsApp"
# 3.8 because of the Windows 7 counters: it is the last Python that starts on
# that OS, and they are frozen against it. Nothing here needs more -- see
# src/waprinter/compat.py, which holds the single exception.
requires-python = ">=3.8"

# Deliberately small. The interface is Tk, which ships with Python, so there is
# no web server, no template engine and no browser runtime to install. The
# spool folder is polled, not watched, so there is no filesystem-events
# library either.
dependencies = [
    # Below 2.0: its frozen build looks for layout resources PyInstaller does
    # not collect, and the CLI dies on startup (seen on CI, 2026-10-30).
    "pymupdf>=1.24,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Windows-only, and optional even there: pywin32 is used only to read document
# titles out of the print spooler's event log. Capture works without it.
windows = [
    "pywin32>=306",
]
dev = [
    "pefile==2023.2.7", # build-time PE validation; supports Python 3.8
    "pytest>=8.0",
    "respx>=0.21",
]

[project.scripts]
waprinter = "waprinter.cli:main"

[project.gui-scripts]
# gui-scripts, not scripts: on Windows this builds a launcher with no console
# window, which is what you want for something that starts at logon.
waprinter-agent = "waprinter.agent:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
# Do not promote DeprecationWarning to an error here: PyMuPDF emits one during
# native module init, and raising inside the C extension's init segfaults the
# interpreter rather than failing a test.
