name: Build Windows installer

# Produces the installer .exe on a Windows runner, so no Windows machine is
# needed to build one. Download it from the run's Artifacts section, or from the
# Releases page when a tag is pushed.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_ocr:
        description: "Build without OCR (smaller, cannot read scanned invoices)"
        type: boolean
        default: false

permissions:
  contents: write   # needed to attach the installer to a release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Tesseract
        if: ${{ !inputs.skip_ocr }}
        run: choco install tesseract --no-progress -y

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Locate Tesseract
        if: ${{ !inputs.skip_ocr }}
        id: tess
        shell: pwsh
        run: |
          # Chocolatey's package location has moved between versions, so find it
          # rather than hardcoding a path that silently produces an OCR-less build.
          $candidates = @(
            'C:\Program Files\Tesseract-OCR',
            'C:\Program Files (x86)\Tesseract-OCR',
            'C:\tools\tesseract'
          )
          $found = $candidates | Where-Object { Test-Path (Join-Path $_ 'tesseract.exe') } | Select-Object -First 1
          if (-not $found) { throw "Tesseract not found in: $($candidates -join ', ')" }
          Write-Host "Found Tesseract at $found"
          "dir=$found" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: |
          $args = @{ Python = 'python'; ISCC = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' }
          if ('${{ inputs.skip_ocr }}' -eq 'true') {
            .\installer\build.ps1 @args -SkipOcr 2>&1 | Tee-Object -FilePath build.log
          } else {
            .\installer\build.ps1 @args -TesseractDir '${{ steps.tess.outputs.dir }}' 2>&1 | Tee-Object -FilePath build.log
          }

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Check the installer exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem 'installer\Output\*.exe' -ErrorAction SilentlyContinue
          if (-not $exe) { throw 'No installer was produced.' }
          $exe | ForEach-Object { Write-Host ("{0} ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB)) }

      - uses: actions/upload-artifact@v4
        with:
          name: WhatsAppPrinter-Setup
          path: installer/Output/*.exe
          if-no-files-found: error
          retention-days: 30

      # The manifest the installed app polls. Generated here rather than
      # committed, because the checksum can only be known once the installer
      # exists, and a manifest whose sha256 is wrong is worse than none: the
      # download is discarded and every machine silently stops updating.
      - name: Write the update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $exe = Get-ChildItem 'installer\Output\*.exe' | Select-Object -First 1
          if ($exe.BaseName -notmatch '(\d+\.\d+\.\d+)$') {
            throw "Cannot read a version out of $($exe.Name)"
          }
          $built = $Matches[1]
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          # A manifest that disagrees with the app's own __version__ either
          # re-installs the same build forever or never offers it at all.
          if ($built -ne $tag) {
            throw "Installer is $built but the tag says $tag. Bump the version before tagging."
          }
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          [ordered]@{
            version = $built
            url     = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($exe.Name)"
            sha256  = $sha
            notes   = "WhatsApp Printer $built"
          } | ConvertTo-Json | Set-Content 'installer\Output\latest.json' -Encoding utf8NoBOM
          Get-Content 'installer\Output\latest.json'

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/*.exe
            installer/Output/latest.json
          generate_release_notes: true
