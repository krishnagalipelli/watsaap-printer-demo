name: Build Windows installer

# Produces the installer .exe on a Windows runner, so no Windows machine is
# needed to build one. Download it from the run's Artifacts section, or from the
# Releases page when a tag is pushed.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_ocr:
        description: "Build without OCR (smaller, cannot read scanned invoices)"
        type: boolean
        default: false

# Read-only by default. Only the job that attaches the installer to a release
# gets to write, and only to contents. Third-party actions are pinned to a
# commit rather than a moving tag, so a compromised tag cannot change what
# runs here with the token that publishes the build every counter installs.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Tesseract
        if: ${{ !inputs.skip_ocr }}
        run: choco install tesseract --no-progress -y

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Locate Tesseract
        if: ${{ !inputs.skip_ocr }}
        id: tess
        shell: pwsh
        run: |
          # Chocolatey's package location has moved between versions, so find it
          # rather than hardcoding a path that silently produces an OCR-less build.
          $candidates = @(
            'C:\Program Files\Tesseract-OCR',
            'C:\Program Files (x86)\Tesseract-OCR',
            'C:\tools\tesseract'
          )
          $found = $candidates | Where-Object { Test-Path (Join-Path $_ 'tesseract.exe') } | Select-Object -First 1
          if (-not $found) { throw "Tesseract not found in: $($candidates -join ', ')" }
          Write-Host "Found Tesseract at $found"
          "dir=$found" >> $env:GITHUB_OUTPUT

      - name: Run tests
        run: |
          python -m pip install -e ".[dev,windows]"
          python -m pytest -q

      - name: Build installer
        shell: pwsh
        run: |
          $args = @{ Python = 'python'; ISCC = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' }
          if ('${{ inputs.skip_ocr }}' -eq 'true') {
            .\installer\build.ps1 @args -SkipOcr 2>&1 | Tee-Object -FilePath build.log
          } else {
            .\installer\build.ps1 @args -TesseractDir '${{ steps.tess.outputs.dir }}' 2>&1 | Tee-Object -FilePath build.log
          }

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log
          path: build.log

      - name: Check the installer exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem 'installer\Output\*.exe' -ErrorAction SilentlyContinue
          if (-not $exe) { throw 'No installer was produced.' }
          $exe | ForEach-Object { Write-Host ("{0} ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB)) }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WhatsAppPrinter-Setup
          path: installer/Output/*.exe
          if-no-files-found: error
          retention-days: 30

  build-win7:
    runs-on: windows-latest
    # The layout tests map a real window and call update(). Tk fighting its own
    # geometry manager is a documented way to hang rather than fail, and a
    # wedged job holds a runner for six hours by default.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # 3.8 is the last Python that starts on Windows 7, and x86 because
          # a 64-bit payload there fails with CreateProcess code 216. Both
          # halves are load-bearing; build.ps1 re-checks them before freezing.
          python-version: "3.8"
          architecture: x86

      - name: Install OCR language data
        if: ${{ !inputs.skip_ocr }}
        run: choco install tesseract --no-progress -y

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 --no-progress -y

      # Run here rather than leaving it to build.ps1, which skips tests under
      # CI. This is the only thing that proves the 3.8 backport still holds,
      # and no other job exercises that interpreter.
      - name: Run the tests on Python 3.8
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c installer/constraints-win7.txt -e ".[dev,windows]"
          python -m pytest -q

      - name: Build installer
        shell: pwsh
        run: |
          $args = @{ Python = 'python'; Target = 'win7-x86'; ISCC = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' }
          if ('${{ inputs.skip_ocr }}' -eq 'true') {
            .\installer\build.ps1 @args -SkipOcr 2>&1 | Tee-Object -FilePath build-win7.log
          } else {
            $candidates = @('C:\Program Files\Tesseract-OCR', 'C:\Program Files (x86)\Tesseract-OCR', 'C:\tools\tesseract')
            $found = $candidates | Where-Object { Test-Path (Join-Path $_ 'tessdata\eng.traineddata') } | Select-Object -First 1
            if (-not $found) { throw 'OCR language data not found.' }
            .\installer\build.ps1 @args -TesseractDir $found 2>&1 | Tee-Object -FilePath build-win7.log
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log-win7
          path: build-win7.log

      - name: Check the installer exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem 'installer\Output\*win7-x86.exe' -ErrorAction SilentlyContinue
          if (-not $exe) { throw 'No Windows 7 installer was produced.' }
          $exe | ForEach-Object { Write-Host ("{0} ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB)) }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WhatsAppPrinter-Setup-win7
          path: installer/Output/*win7-x86.exe
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-win7]
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Gather both installers and write manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY -n WhatsAppPrinter-Setup -D release
          if ($LASTEXITCODE -ne 0) { throw 'Could not download x64 build.' }
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY -n WhatsAppPrinter-Setup-win7 -D release
          if ($LASTEXITCODE -ne 0) { throw 'Could not download Windows 7 build.' }
          python packaging/make_update_manifest.py release $env:GITHUB_REPOSITORY $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Manifest validation failed.' }
      - name: Attach both builds to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release/*.exe
            release/latest.json
          generate_release_notes: true
